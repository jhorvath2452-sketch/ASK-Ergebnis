name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Tests + Debug-APK bauen
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Fehler als Hinweise ausgeben
        if: failure()
        run: |
          grep -E "^e: " build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for fail in list(tc.iter("failure")) + list(tc.iter("error")):
                      msg = (fail.get("message") or fail.text or "").replace("\n", " ")[:400]
                      print(f"::error::TEST {tc.get('classname')}.{tc.get('name')}: {msg}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: ASK-Ergebnis-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Testbericht hochladen (bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Testbericht
          path: app/build/reports/tests/
